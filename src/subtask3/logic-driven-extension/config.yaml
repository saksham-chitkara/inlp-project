# ─── Logic-Driven Extension Configuration ─────────────────────────────────────
# Subtask 3: Multilingual Syllogistic Reasoning
# All hyperparameters are loaded from this file — no hardcoded values elsewhere.

# ─── Model ─────────────────────────────────────────────────────────────────────
model:
  name: "xlm-roberta-base"
  max_seq_len: 384
  num_labels: 2            # 0 = invalid, 1 = valid
  dropout_rate: 0.1

# ─── Contrastive Learning ──────────────────────────────────────────────────────
contrastive:
  alpha: 0.5               # weight for contrastive loss: L = L_CE + alpha * L_CL
  cosine_margin: 0.5       # margin for CosineEmbeddingLoss

# ─── Training ──────────────────────────────────────────────────────────────────
training:
  batch_size: 8           # smaller due to contrastive pairs doubling memory
  eval_batch_size: 24
  num_epochs: 7
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  early_stopping_patience: 3
  seed: 42
  validation_split: 0.25

# ─── Paths (relative to project root) ──────────────────────────────────────────
paths:
  train_data: "dataset/train_data/subtask 3/train_data_translated.json"
  test_data: "dataset/test_data/subtask 3/test_data_subtask_3.json"
  eval_script: "dataset/evaluation_kit/task 1 & 3/evaluation_script.py"
  output_dir: "src/subtask3/logic-driven-extension/outputs"
  checkpoints_dir: "src/subtask3/logic-driven-extension/checkpoints"
  configs_dir: "src/subtask3/logic-driven-extension/configs"

# ─── Parser ────────────────────────────────────────────────────────────────────
parser:
  spacy_model: "en_core_web_sm"

# ─── Label Mapping ─────────────────────────────────────────────────────────────
labels:
  true: 1
  false: 0
